<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Habit Tracker</title>
    <link rel="stylesheet" href="./css/style.css" />
</head>

<body>
    <header class="app-header">
        <h1>Smart Habit Tracker</h1>
        <button id="themeToggle" title="Toggle dark mode">🌙</button>
    </header>

    <main class="container">
        <!-- Add habit -->
        <section class="add-habit">
            <input type="text" id="habitName" placeholder="New habit..." />
            <input type="color" id="habitColor" value="#4f46e5" />
            <button id="addHabitBtn">Add</button>
        </section>

        <!-- Progress -->
        <section class="progress-section">
            <div class="progress-info">
                <span>Today's progress</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </section>

        <!-- Habit list -->
        <section id="habitList" class="habit-list"></section>
    </main>

    <script src="./js/script.js"></script>
</body>

</html>
