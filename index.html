<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Habit Tracker</title>
    <link rel="stylesheet" href="/style.css" />
</head>

<body>
    <header class="app-header">
        <h1>Smart Habit Tracker</h1>
    </header>
    <main class="container">
        <p>Project is starting...</p>
        
        <!-- Add habit -->
        <section class="add-habit">
            <input type="text" id="habitName" placeholder="New habit..." />
            <input type="color" id="habitColor" value="#4f46e5" />
            <button id="addHabitBtn">Add</button>
        </section>

        <!-- Progress -->
        <section class="progress-section">
            <div class="progress-info">
                <span>Today's progress</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </section>

    </main>
    <script src="/script.js"></script>
</body>

</html>
